name: Speakeasy device agent
description: Connect this job's AI tools to Speakeasy with the job's GitHub OIDC token. No stored Speakeasy secret.
author: Speakeasy
branding:
  icon: shield
  color: green

inputs:
  organization-id:
    description: Your Speakeasy organization ID.
    required: true
  project:
    description: Speakeasy project slug for this job. Hook events go to it. Leave it empty to turn hook events off.
    required: false
    default: ""
  control-plane-url:
    description: >-
      The Speakeasy control plane. speakeasyd builds the token audience from it, so it must be the host
      that serves the device-agent API.
    required: false
    default: https://ai.speakeasy.com
  version:
    description: >-
      The speakeasyd version to install: `latest` for the latest stable release, or a stable version like
      `0.1.52`. Pin one for reproducible builds: pinning this action does not pin speakeasyd.
    required: false
    default: latest
  speakeasyd-binary:
    description: >-
      Path to a speakeasyd binary already on the runner, used instead of a release. For testing unreleased
      builds only.
    required: false
    default: ""

outputs:
  report:
    description: Path to the JSON report from `speakeasyd sync --once`.
    value: ${{ steps.setup.outputs.report }}
  skipped:
    description: "`true` when the step skipped, for example on a pull request from a fork."
    value: ${{ steps.setup.outputs.skipped }}
  daemon:
    description: "`true` when a speakeasyd is running for later steps to get tokens from."
    value: ${{ steps.setup.outputs.daemon }}
  version:
    description: The speakeasyd version installed, for example `0.1.52`. Empty with `speakeasyd-binary`.
    value: ${{ steps.setup.outputs.version }}

runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/setup.sh"
      env:
        INPUT_ORGANIZATION_ID: ${{ inputs.organization-id }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_CONTROL_PLANE_URL: ${{ inputs.control-plane-url }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SPEAKEASYD_BINARY: ${{ inputs.speakeasyd-binary }}
        IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
