name: Release

# Runs for a pushed exact version tag, or from the Actions tab with a version and an
# optional commit, which it tags itself. The moving minor tags (v0.1) don't match, and
# pull requests never trigger it.
on:
  push:
    tags:
      - "v0.*.*"
      - "v[1-9]*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag and release, like v0.1.1.
        required: true
        type: string
      commit:
        description: Commit SHA to tag, full or short. Defaults to the head of the branch you run this from (main by default).
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.version || github.ref_name }}
      SEMVER: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
    steps:
      - name: Check the version and find its commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$TAG" =~ $SEMVER ]]; then
            echo "::error::$TAG is not a vMAJOR.MINOR.PATCH version, so it gets no release."
            exit 1
          fi
          if [[ -n "$COMMIT" && ! "$COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::commit must be a commit SHA, got: $COMMIT"
            exit 1
          fi
          # GITHUB_SHA is the pushed tag's commit (even for an annotated tag), or the head of
          # the branch a manual run starts from. The lookup expands a short SHA.
          if ! sha=$(gh api "repos/$GH_REPO/commits/${COMMIT:-$GITHUB_SHA}" --jq .sha 2>/dev/null); then
            echo "::error::$GH_REPO has no commit ${COMMIT:-$GITHUB_SHA}."
            exit 1
          fi
          echo "Releasing $TAG at $sha."
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Tag the commit, unless the tag is already there
        run: |
          if existing=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha 2>/dev/null); then
            [[ "$existing" == "$SHA" ]] || { echo "::error::$TAG already exists at $existing, not $SHA."; exit 1; }
            echo "$TAG already points at $SHA."
            exit 0
          fi
          object=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="$TAG" -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
          echo "Tagged $SHA as $TAG."

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The $TAG release already exists."
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi

      - name: Move the minor tag to this release
        run: |
          minor="${TAG%.*}"
          latest=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$minor." --jq '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E "$SEMVER" | sort -V | tail -n 1)
          if [[ "$latest" != "$TAG" ]]; then
            echo "::notice::$latest is later than $TAG, so $minor stays where it is."
            exit 0
          fi

          if gh api "repos/$GH_REPO/git/ref/tags/$minor" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$minor" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$minor" -f sha="$SHA" >/dev/null
          fi
          echo "$minor now points at $TAG ($SHA)."
